name: cyberaudit-lab
services:
  safe-http:
    image: python:3.12-alpine
    command: ["python", "/lab/server.py", "--host-mode", "container"]
    volumes:
      - ./lab/server.py:/lab/server.py:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/secure"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [lab]
  safe-tls:
    image: python:3.12-slim
    command: ["sh", "-c", "pip install --no-cache-dir 'cryptography>=46,<47' && python /lab/tls_server.py --host-mode container"]
    volumes:
      - ./lab/tls_server.py:/lab/tls_server.py:ro
    ports:
      - "127.0.0.1:8443:8443"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [lab]
networks:
  lab:
    internal: true
