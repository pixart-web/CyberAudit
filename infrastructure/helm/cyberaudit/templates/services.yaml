apiVersion: v1
kind: Service
metadata: { name: {{ include "cyberaudit.fullname" . }}-api }
spec:
  selector: { app.kubernetes.io/name: cyberaudit, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "cyberaudit.fullname" . }}-web }
spec:
  selector: { app.kubernetes.io/name: cyberaudit, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 3000, targetPort: http }]
