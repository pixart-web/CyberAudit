apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cyberaudit.fullname" . }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app.kubernetes.io/name: cyberaudit, app.kubernetes.io/component: migration } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}@{{ required "API image digest is required" .Values.image.api.digest }}"
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
