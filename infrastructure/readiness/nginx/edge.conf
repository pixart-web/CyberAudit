limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
  listen 8443 ssl;
  server_name cyberaudit.localhost;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream api:8000;
  ssl_certificate /run/tls/service.crt;
  ssl_certificate_key /run/tls/private/service.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://$api_upstream;
  }
  location /health { proxy_pass http://$api_upstream/health; }
  location /ready { proxy_pass http://$api_upstream/ready; }
  location / { proxy_pass http://web:3000; }
}
