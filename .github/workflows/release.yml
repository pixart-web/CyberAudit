name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  readiness-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m venv .venv && .venv/bin/pip install -e "apps/api[dev]"
      - name: Reject tags without checksum-bound candidate evidence
        run: make readiness-gate
      - name: Reject unaccepted HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
  images:
    needs: readiness-gate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: infrastructure/docker/api.Dockerfile
          - component: web
            dockerfile: infrastructure/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/cyberaudit-${{ matrix.component }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign immutable image digest
        run: >-
          cosign sign --yes
          ghcr.io/${{ github.repository_owner }}/cyberaudit-${{ matrix.component }}@${{ steps.build.outputs.digest }}
  release-bundle:
    needs: [readiness-gate, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action/download-syft@v0.20.6
      - uses: sigstore/cosign-installer@v3
      - name: Generate source SBOMs
        run: |
          mkdir -p dist
          syft dir:apps/api -o cyclonedx-json=dist/cyberaudit-api-${{ github.ref_name }}.cdx.json
          syft dir:apps/web -o cyclonedx-json=dist/cyberaudit-web-${{ github.ref_name }}.cdx.json
      - name: Build immutable source bundle
        run: |
          git archive --format=tar.gz --prefix=cyberaudit-${{ github.ref_name }}/ \
            --output=dist/cyberaudit-${{ github.ref_name }}.tar.gz "${{ github.sha }}"
          syft file:dist/cyberaudit-${{ github.ref_name }}.tar.gz \
            -o cyclonedx-json=dist/cyberaudit-bundle-${{ github.ref_name }}.cdx.json
          sha256sum dist/* > dist/SHA256SUMS
      - name: Keyless-sign release files
        run: |
          for artifact in dist/*.json dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/cyberaudit-${{ github.ref_name }}.tar.gz
      - name: Verify signatures before publication
        run: |
          for artifact in dist/*.json dist/*.tar.gz dist/SHA256SUMS; do
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done
      - name: Publish release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --verify-tag --prerelease --generate-notes
