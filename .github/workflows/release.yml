name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: infrastructure/docker/api.Dockerfile
          - component: web
            dockerfile: infrastructure/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/cyberaudit-${{ matrix.component }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign immutable image digest
        run: >-
          cosign sign --yes
          ghcr.io/${{ github.repository_owner }}/cyberaudit-${{ matrix.component }}@${{ steps.build.outputs.digest }}
