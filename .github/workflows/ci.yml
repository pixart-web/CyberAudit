name: security-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e "apps/api[dev]" pip-audit
      - run: ruff check apps/api
      - run: black --check apps/api
      - run: mypy apps/api/cyberaudit
      - run: pytest apps/api --cov-fail-under=60
      - run: pip-audit
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22.17.1", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @cyberaudit/web build
      - run: pnpm audit --audit-level high
  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-alpine3.22
        env:
          POSTGRES_DB: cyberaudit
          POSTGRES_USER: cyberaudit
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyberaudit" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install -e "apps/api"
      - run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://cyberaudit:ci-only-password@127.0.0.1:5432/cyberaudit
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Reject common private-key and live-token signatures
        run: |
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}'; then
            echo "Potential secret material detected."
            exit 1
          fi
