name: cyberaudit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberaudit
      POSTGRES_USER: cyberaudit
      POSTGRES_PASSWORD: cyberaudit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberaudit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - uploads:/data/uploads
      - ./apps/api:/app/apps/api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal, edge]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["dramatiq", "cyberaudit.worker", "cyberaudit.phase4_worker", "cyberaudit.enterprise_worker", "--processes", "1", "--threads", "2"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, assessment_lab]

  lab-http:
    profiles: ["lab"]
    image: python:3.12-alpine
    command: ["python", "/lab/server.py", "--host-mode", "container"]
    volumes:
      - ./infrastructure/lab/server.py:/lab/server.py:ro
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [assessment_lab]

  lab-tls:
    profiles: ["lab"]
    build:
      context: .
      dockerfile: infrastructure/docker/lab.Dockerfile
    command: ["python", "/lab/tls_server.py", "--host-mode", "container"]
    volumes:
      - ./infrastructure/lab/tls_server.py:/lab/tls_server.py:ro
    ports: ["127.0.0.1:8443:8443"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [assessment_lab]

  lab-banners:
    profiles: ["lab"]
    image: python:3.12-alpine
    command: ["python", "/lab/network_services.py"]
    volumes:
      - ./infrastructure/lab/network_services.py:/lab/network_services.py:ro
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:5433:5433"
      - "127.0.0.1:6380:6380"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [assessment_lab]

  appsec-lab:
    profiles: ["appsec-lab"]
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8090", "--directory", "/fixtures"]
    volumes:
      - ./infrastructure/appsec-lab:/fixtures:ro
    ports: ["127.0.0.1:8090:8090"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [assessment_lab]

volumes:
  postgres_data:
  redis_data:
  uploads:
networks:
  internal:
    internal: true
  edge:
  assessment_lab:
    internal: true
