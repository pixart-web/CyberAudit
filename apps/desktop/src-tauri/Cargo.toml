[package]
name = "cyberaudit-desktop"
version = "0.1.0"
description = "Native CyberAudit OS desktop shell"
authors = ["PIXART"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "cyberaudit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"

